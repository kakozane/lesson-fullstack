# 宿主机 Nginx；证书首次签发后安装此文件并执行 nginx -t && nginx -s reload。
server {
    listen 80;
    server_name test.retniw.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/test.retniw.cc;
        try_files $uri =404;
    }
    location / { return 301 https://test.retniw.cc$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name test.retniw.cc;
    ssl_certificate /www/server/panel/vhost/cert/test.retniw.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/test.retniw.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /www/wwwlogs/test.retniw.cc.log;
    error_log /www/wwwlogs/test.retniw.cc.error.log;
    location / {
        proxy_pass http://127.0.0.1:6330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
