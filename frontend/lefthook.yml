pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: '*.{ts,tsx,js,jsx,vue,json,yaml,yml,md,html,css,scss}'
      stage_fixed: true
      run: bash scripts/run-with-node.sh pnpm exec oxfmt {staged_files}
    eslint:
      glob: '*.{ts,tsx,js,jsx,vue}'
      run: bash scripts/run-with-node.sh pnpm exec eslint --cache {staged_files}

post-merge:
  commands:
    install:
      run: bash scripts/run-with-node.sh pnpm install
