name: Deploy course demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson-fullstack-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Go
        working-directory: backend
        run: go test -race ./... && go vet ./...
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          # ACR 个人版兼容普通镜像 manifest。
          provenance: false
          sbom: false
          tags: ${{ vars.ACR_IMAGE }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=lesson-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lesson-${{ matrix.service }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          target="root@$DEPLOY_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p /opt/lesson-fullstack/releases/$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.yaml deploy/release.sh "$target:/opt/lesson-fullstack/releases/$RELEASE_SHA/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "bash /opt/lesson-fullstack/releases/$RELEASE_SHA/release.sh $RELEASE_SHA"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
